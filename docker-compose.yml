services:
  db:
    image: postgres:16
    # Headroom for the concurrency test (many simultaneous connections) and the
    # 8-worker benchmark. Well above Postgres' default of 100.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    volumes:
      - relay_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The application image. In Phase 0 it just applies migrations on boot and then
  # idles — the worker loop, publisher and control-plane API land in later phases
  # and will be added as their own commands/services here.
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  relay_db:
