# Render Blueprint — one-click full-system deploy.
#
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file and
# provisions a managed Postgres and one web service that runs `relay demo` (API +
# dashboard + workers + reaper + publisher in one process). The Docker entrypoint
# applies Alembic migrations on boot, so the first deploy is turnkey.
#
# Redis is intentionally NOT provisioned here: Render's free tier allows only one Key
# Value instance per account. Redis only powers the outbox publisher (which fails
# quietly when absent) — the queue and dashboard work fully without it. To enable the
# publisher, add a REDIS_URL env var in the Render dashboard pointing at any Redis
# (your existing Render Key Value's Internal URL, or a free Upstash URL).
#
# Free tier: the web service sleeps after ~15 min idle and cold-starts on the next
# request (the workers pause while it's asleep). For always-on processing, bump the web
# service off free and/or split the workers into their own `type: worker` service
# running `relay worker` + `relay reaper` + `relay publisher` (see DEPLOY.md).

databases:
  - name: relay-db
    plan: free
    databaseName: relay
    user: relay

services:
  - type: web
    name: relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Overrides the image CMD; the ENTRYPOINT still runs migrations first. No --port:
    # the app reads Render's $PORT. --host 0.0.0.0 is required inside the container.
    dockerCommand: relay demo --host 0.0.0.0 --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      # REDIS_URL is optional — add it in the dashboard to enable the outbox publisher.
