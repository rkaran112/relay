# Render Blueprint — one-click full-system deploy.
#
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file and
# provisions one web service that runs `relay demo` (API + dashboard + workers +
# reaper + publisher in one process). The Docker entrypoint applies Alembic
# migrations on boot, so an empty database is enough.
#
# The database is NOT created here. Render deletes its free Postgres after about 30 days
# (plus a short grace period), which breaks the deploy. Use an external Postgres that
# does not expire (for example Neon's free plan) and paste its connection string into
# the DATABASE_URL environment variable in the Render dashboard.
#
# Redis is intentionally NOT provisioned here: Render's free tier allows only one Key
# Value instance per account. Redis only powers the outbox publisher (which fails
# quietly when absent) — the queue and dashboard work fully without it. To enable the
# publisher, add a REDIS_URL env var in the Render dashboard pointing at any Redis
# (your existing Render Key Value's Internal URL, or a free Upstash URL).
#
# Free tier: the web service sleeps after ~15 min idle and cold-starts on the next
# request (the workers pause while it's asleep). For always-on processing, bump the web
# service off free and/or split the workers into their own `type: worker` service
# running `relay worker` + `relay reaper` + `relay publisher` (see DEPLOY.md).

services:
  - type: web
    name: relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand on purpose: Render's dockerCommand REPLACES the image ENTRYPOINT,
    # which would skip the migrate-on-boot step. Letting the Dockerfile's ENTRYPOINT +
    # CMD run means migrations apply first, then `relay demo` starts (binds $PORT).
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false   # set by hand in the dashboard; never stored in the repo
      # REDIS_URL is optional — add it in the dashboard to enable the outbox publisher.
